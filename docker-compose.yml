services:
  ysp-live:
    image: ysp-live:9.8-TMXK
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ysp-live
    restart: unless-stopped
    network_mode: host
    dns:
      - 223.5.5.5
      - 119.29.29.29
      - 1.1.1.1
    volumes:
      # Installer keeps the previous host data path in .env during upgrades.
      - "${YSP_HOST_DATA_DIR:-./data}:/app/data"
    environment:
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
      - YSP_DATA_DIR=/app/data
      - NODE_OPTIONS=--max-old-space-size=256 --optimize-for-size
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8767/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
